<!DOCTYPE html>
<html>
<head>
    <title>Kiwi Search</title>
</head>
<body>

<h1>🥝 Kiwi Search</h1>

<h2 id="query"></h2>

<script>
const params = new URLSearchParams(window.location.search);
const q = params.get("q");

document.getElementById("query").textContent =
    'Results for "' + q + '"';
</script>

</body>
</html>
